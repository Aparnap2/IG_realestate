# Configuration for pytest

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=60 --verbose
asyncio_mode = auto

# Coverage configuration
[coverage:run]
omit =
    tests/*
    conftest.py
    venv/*
    __pycache__/*
    */migrations/*
    */venv/*
    */virtualenv/*
    setup.py
    */site-packages/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod
precision = 2
show_missing = true
skip_covered = false

[coverage:html]
directory = htmlcov