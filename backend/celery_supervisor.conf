# Health check endpoint (external monitoring)
# Add to your monitoring system:
# curl -f http://localhost:5555/api/workers || echo "Flower monitoring unavailable"

# Usage instructions:
# 1. Start all services: supervisorctl start celery_services:*
# 2. Start individual services: supervisorctl start celery_whatsapp_worker
# 3. View logs: supervisorctl tail celery_whatsapp_worker
# 4. Check status: supervisorctl status
# 5. Restart service: supervisorctl restart celery_whatsapp_worker
# 6. Monitor Flower: http://localhost:5555 (admin:secure_password_2025)