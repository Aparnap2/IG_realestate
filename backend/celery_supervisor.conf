# Production-ready Celery Worker Supervision Configuration
# This configuration provides robust worker management with proper monitoring,
# health checks, and automatic recovery.

# Ensure log directory exists
[supervisord]
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

# Celery Worker for WhatsApp Processing
[program:celery_whatsapp_worker]
command=celery -A backend.celery_app worker --loglevel=info --concurrency=4 --queues=whatsapp_processing --hostname=whatsapp_worker@%h
directory=/home/aparna/Desktop/IG_realestate/backend
user=aparna
autostart=true
autorestart=true
startretries=3
exitcodes=0,1,2
stopsignal=TERM
stopwaitsecs=30
numprocs=1
startsecs=10
redirect_stderr=true
stdout_logfile=/var/log/celery/whatsapp_worker.out.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stderr_logfile=/var/log/celery/whatsapp_worker.err.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
environment=PYTHONPATH="/home/aparna/Desktop/IG_realestate/backend:%(ENV_PYTHONPATH)s",CELERY_BROKER_URL="%(ENV_CELERY_BROKER_URL)s",CELERY_RESULT_BACKEND="%(ENV_CELERY_RESULT_BACKEND)s",SUPABASE_URL="%(ENV_SUPABASE_URL)s",SUPABASE_KEY="%(ENV_SUPABASE_KEY)s"
priority=10

