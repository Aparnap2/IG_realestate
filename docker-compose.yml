version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      - redis
  
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: .
      dockerfile: backend.dockerfile
    command: celery -A backend.celery_app worker --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      - redis

  celery_beat:
    build:
      context: .
      dockerfile: backend.dockerfile
    command: celery -A backend.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      - redis