version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      - redis
      - db
  
  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
      - VITE_SUPABASE_KEY=${VITE_SUPABASE_KEY}
    depends_on:
      - backend
  
  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:latest
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password
      - NEO4J_PLUGINS=["graph-data-science"]
    volumes:
      - neo4j_data:/data

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aaa_realestate}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  celery_worker:
    build:
      context: .
      dockerfile: backend.dockerfile
    command: celery -A backend.celery_app worker --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      - redis
      - db

  celery_beat:
    build:
      context: .
      dockerfile: backend.dockerfile
    command: celery -A backend.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      - redis
      - db

volumes:
  postgres_data:
  neo4j_data: