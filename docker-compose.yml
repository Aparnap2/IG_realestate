version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend.dockerfile
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    depends_on:
      - redis
      - db
  
  redis:
    image: redis:latest
    ports:
      - "6379:6379"
  
  db:
    image: postgres:13
    environment:
      POSTGRES_USER: supabase
      POSTGRES_PASSWORD: supabase
      POSTGRES_DB: supabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  celery_worker:
    build:
      context: .
      dockerfile: backend.dockerfile
    command: celery -A backend.celery_app worker --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      - redis
      - db

  celery_beat:
    build:
      context: .
      dockerfile: backend.dockerfile
    command: celery -A backend.celery_app beat --loglevel=info
    env_file:
      - backend/.env
    depends_on:
      - redis
      - db

volumes:
  postgres_data: